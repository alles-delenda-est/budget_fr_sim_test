name: Veille yields.json (LVTShift)

# Compare yields.json de LVTShift (branche main, ou la référence donnée à la main) au fichier vendu
# src/engine/data/lvt-yields.json. S'il diffère ou si sa structure n'est plus conforme : le job échoue et une issue
# est ouverte (une seule à la fois). Aucun import automatique : la mise à jour reste une PR relue
# (npm run sync:lvt -- <commit>, docs/review-lvt-module.md §8).

on:
  schedule:
    - cron: '17 4 * * *' # tous les jours, 04:17 UTC
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit (SHA complet) ou branche de LVTShift à comparer'
        required: false
        default: main

permissions:
  contents: read
  issues: write

concurrency:
  group: lvt-yields-watch
  cancel-in-progress: false

jobs:
  compare:
    name: Comparer yields.json au fichier vendu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Comparer (sans écrire)
        id: check
        env:
          LVT_REF: ${{ inputs.ref || 'main' }}
        run: |
          set +e
          node scripts/sync-lvt-yields.mjs "$LVT_REF" --check > check.txt 2>&1
          code=$?
          set -e
          cat check.txt
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Ouvrir une issue si yields.json a changé
        if: steps.check.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="LVTShift : yields.json diffère du fichier vendu"
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq 'length')
          if [ "$open" = "0" ]; then
            {
              echo "La veille quotidienne a trouvé un écart entre yields.json de LVTShift et src/engine/data/lvt-yields.json (ou une structure non conforme)."
              echo
              echo '````text'
              sed 's/```/``\\`/g' check.txt
              echo '````'
              echo
              echo "Mise à jour : npm run sync:lvt -- <commit>, relire le diff, npx vitest run, PR vers review/day0 (docs/review-lvt-module.md §8)."
              echo
              echo "Exécution : $RUN_URL"
            } > body.md
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file body.md
          else
            echo "Une issue est déjà ouverte : rien de plus."
          fi
          exit 1
